<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>DeskMail Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,850&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/widget.css" />
    <script src="/static/widget.js" defer></script>
  </head>
  <body>
    <div class="wallpaper-field" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="scanline"></span>
    </div>

    <main class="widget-shell" aria-label="Desktop temporary mail widget">
      <section class="desk-widget">
        <header class="window-bar">
          <div class="window-identity pywebview-drag-region">
            <span class="window-dot" aria-hidden="true"></span>
            <div class="window-brand">
              <p class="eyebrow">desktop otp receiver</p>
              <h1>DeskMail</h1>
            </div>
          </div>
          <div class="window-controls" aria-label="Window controls">
            <button
              id="native-minimize"
              class="window-control"
              type="button"
              aria-label="Minimize to tray"
              title="Minimize to tray"
              disabled
            >
              <span aria-hidden="true">&#8722;</span>
            </button>
            <button
              id="native-close"
              class="window-control is-danger"
              type="button"
              aria-label="Close widget"
              title="Close widget"
              disabled
            >
              <span aria-hidden="true">&#10005;</span>
            </button>
          </div>
        </header>

        <section class="widget-core" aria-label="Temporary mailbox and latest code">
          <form id="widget-form" class="generator">
            <label class="domain-field">
              <span>Domain</span>
              <div id="domain-picker" class="domain-picker">
                <input id="domain-value" name="domain" type="hidden" value="" />
                <button
                  id="domain-trigger"
                  class="domain-trigger"
                  type="button"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  disabled
                >
                  <span id="domain-current" class="domain-current">@domain</span>
                  <span class="domain-chevron" aria-hidden="true"></span>
                </button>
                <div id="domain-panel" class="domain-panel is-hidden">
                  <div class="domain-panel-head">
                    <strong>Choose domain</strong>
                    <small id="domain-count">0 domains</small>
                  </div>
                  <div
                    id="domain-option-list"
                    class="domain-option-list"
                    role="listbox"
                    aria-label="Mailbox domain options"
                  ></div>
                </div>
              </div>
            </label>
            <button id="generate" type="submit">New inbox</button>
          </form>

          <button id="address-card" class="address-card is-empty" type="button" disabled>
            <small>Generated mail</small>
            <strong>No address yet</strong>
            <span>Choose domain and generate</span>
          </button>

          <button id="latest-code-card" class="signal-card is-empty" type="button" disabled>
            <small>Last OTP</small>
            <strong id="latest-code-value">Waiting</strong>
            <span id="latest-code-meta">No code received yet</span>
          </button>

          <div id="turnstile-slot" class="turnstile-slot is-hidden" aria-live="polite">
            <span>Human gate check...</span>
          </div>

          <span id="status" class="status" role="status">Ready.</span>
        </section>
      </section>
    </main>
  </body>
</html>
