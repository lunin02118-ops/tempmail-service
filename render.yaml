services:
  - type: web
    name: tempmail-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_MAIL_DOMAINS
        sync: false
      - key: PUBLIC_MAIL_DOMAIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: INGEST_WEBHOOK_SECRET
        sync: false
      - key: ARCHIVE_ADMIN_TOKEN
        sync: false
      - key: TURNSTILE_ENABLED
        value: "false"
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: GROQ_API_KEYS
        sync: false
